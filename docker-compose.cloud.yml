name: printqueue-cloud
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: printqueue
      POSTGRES_USER: printqueue
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printqueue -d printqueue"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      DB_URL: jdbc:postgresql://db:5432/printqueue
      DB_USER: printqueue
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      OWNER_USERNAME: ${OWNER_USERNAME:-owner}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD in .env}
      OWNER_RESET_PASSWORD: 'false'
      UPLOAD_DIR: /srv/uploads
      LIBREOFFICE_PATH: /usr/bin/soffice
    volumes:
      - customer_uploads:/srv/uploads
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 45s

  web:
    build: ./dashboard
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [private]

volumes:
  postgres_data:
  customer_uploads:
  caddy_data:
  caddy_config:
networks:
  private: {}
