spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/printqueue}
spring.datasource.username=${DB_USER:printqueue}
spring.datasource.password=${DB_PASSWORD:localdev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=8080
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=20MB

# The owner password must be set before startup. Do not use demo passwords in production.
app.owner.username=${OWNER_USERNAME:owner}
app.owner.password=${OWNER_PASSWORD:}
app.upload-dir=${UPLOAD_DIR:private-uploads}
spring.servlet.multipart.max-request-size=1500MB

# One-time opt-in password recovery for existing owner
app.owner.reset-password=${OWNER_RESET_PASSWORD:false}

# Apply Phase 9 compatibility migration before JPA queries and Hibernate DDL.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false
